function stages(c){return STAGES.filter(s=>s.cefr===c)}function renderLevels(){levels.innerHTML="";LEVELS.forEach(([c,n,d])=>{let done=db.progress[c]||0,b=document.createElement("button");b.className="level";b.innerHTML=`<span class="badge">${done}/10</span><h2 style="color:${COLORS[c]}">${c}</h2><strong>${n}</strong><small>${d}</small><div class="progress"><i style="width:${done*10}%;background:${COLORS[c]}"></i></div>`;b.onclick=()=>openStages(c);levels.appendChild(b)})}

    const nr=Math.max(13,b.r*.48);

      x:b.x+(k?nr:-nr), y:b.y-4,

function bgImage(s){const key=String(s.n);if(!bgImages[key]){const im=new Image();im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(EMBEDDED_BACKGROUNDS[key]);bgImages[key]=im;}return bgImages[key]}
function drawBg(s){const im=bgImage(s);if(im.complete&&im.naturalWidth)ctx.drawImage(im,0,0,W,PLAY_H);else{ctx.fillStyle="#8db9d8";ctx.fillRect(0,0,W,PLAY_H)}ctx.fillStyle="#0b1018dd";round(18,18,360,72,9);ctx.fill();ctx.font="900 18px system-ui";ctx.fillStyle="#fff";ctx.fillText(`🇩🇪 ${s.location}`,34,48);ctx.font="600 12px system-ui";ctx.fillStyle="#d8deea";ctx.fillText(`${s.landmark} · ${s.state}`,34,69);ctx.font="900 11px system-ui";ctx.fillText("DEUTSCHLAND",W-125,32)}

function bubble(b,c,target){ctx.save();ctx.shadowColor="#0008";ctx.shadowBlur=8;ctx.shadowOffsetY=5;let g=ctx.createRadialGradient(b.x-b.r*.35,b.y-b.r*.4,3,b.x,b.y,b.r);g.addColorStop(0,"#fff");g.addColorStop(.12,c);g.addColorStop(1,"#202531");ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.shadowColor="transparent";ctx.strokeStyle="#fff7";ctx.stroke();if(target){ctx.fillStyle="#fff";ctx.font=`900 ${b.r>48?18:14}px system-ui`;ctx.textAlign="center";ctx.textBaseline="middle";wrapText(b.text,b.x,b.y,b.r*1.7)}ctx.restore()}
function wrapText(t,x,y,max){let a=t.split(" "),lines=[],line="";for(let w of a){let z=line?line+" "+w:w;if(ctx.measureText(z).width>max&&line){lines.push(line);line=w}else line=z}if(line)lines.push(line);lines.forEach((l,i)=>ctx.fillText(l,x,y+(i-(lines.length-1)/2)*17))}

function pop(x,y){for(let i=0;i<16;i++){let a=Math.random()*7;particles.push({x,y,vx:Math.cos(a)*(1+Math.random()*3),vy:Math.sin(a)*(1+Math.random()*3)-1,life:20+Math.random()*20,max:40,r:2+Math.random()*3,c:i%2?"#fff":"#ffd447"})}}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",650)}
let ac=null;function audioOn(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}}function beep(f,d,type="sine",g=.04){if(!ac)return;let o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.value=f;v.gain.value=g;o.connect(v);v.connect(ac.destination);o.start();v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}function speak(t){if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.88;speechSynthesis.speak(u)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
document.getElementById("homeBtn").onclick=()=>{state="menu";renderLevels();show("menu")};document.getElementById("backLevels").onclick=()=>{renderLevels();show("menu")};document.getElementById("quit").onclick=()=>openStages(selected);
function hold(el,k){el.onpointerdown=e=>{e.preventDefault();keys[k]=true};["pointerup","pointercancel","pointerleave"].forEach(t=>el.addEventListener(t,()=>keys[k]=false))}hold(document.getElementById("left"),"left");hold(document.getElementById("right"),"right");document.getElementById("fire").onpointerdown=e=>{e.preventDefault();shoot()};
addEventListener("keydown",e=>{if(e.code==="ArrowLeft"||e.code==="KeyA")keys.left=true;if(e.code==="ArrowRight"||e.code==="KeyD")keys.right=true;if(e.code==="Space"||e.code==="ArrowUp")shoot()});addEventListener("keyup",e=>{if(e.code==="ArrowLeft"||e.code==="KeyA")keys.left=false;if(e.code==="ArrowRight"||e.code==="KeyD")keys.right=false});
function loop(){if(state==="play")step();draw();requestAnimationFrame(loop)}topHud();renderLevels();loop();if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(()=>{}));
</script></body></html>
