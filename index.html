const LEVELS=[["A1","Anfänger","Wörter, Artikel, einfache Sätze"],["A2","Grundstufe","Alltag, Reisen, Vergangenheit"],["B1","Mittelstufe","Fälle, Meinungen, Arbeit"],["B2","Fortgeschritten","Nebensätze, Passiv, Nuancen"],["C1","Sehr fortgeschritten","Stil, Präzision, anspruchsvolle Sprache"],["C2","Meister","Idiome, Feinheiten, komplexer Ausdruck"]];
const FLAG="🇩🇪", COLORS={A1:"#5ec8ff",A2:"#68d7a0",B1:"#ffd447",B2:"#ff9f5a",C1:"#e77cff",C2:"#ff657b"};
const KEY="deutsch-pang-v2";let db=JSON.parse(localStorage.getItem(KEY)||"null")||{xp:0,streak:0,progress:{A1:0,A2:0,B1:0,B2:0,C1:0,C2:0},mastery:{}};
let currentStage=null,selected="A1",queue=[],qItem=null,balloons=[],bonus=[],particles=[],harpoon=null,player=null,lives=5,stageXP=0,combo=0,invuln=0,state="menu";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),W=960,H=600,PLAY_H=556,keys={left:false,right:false};
function save(){localStorage.setItem(KEY,JSON.stringify(db));topHud()}function topHud(){xp.textContent=db.xp;streak.textContent=db.streak}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("on"));document.getElementById(id).classList.add("on")}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function stages(c){return STAGES.filter(s=>s.cefr===c)}function renderLevels(){levels.innerHTML="";LEVELS.forEach(([c,n,d])=>{let done=db.progress[c]||0,b=document.createElement("button");b.className="level";b.innerHTML=`<span class="badge">${done}/10</span><h2 style="color:${COLORS[c]}">${c}</h2><strong>${n}</strong><small>${d}</small><div class="progress"><i style="width:${done*10}%;background:${COLORS[c]}"></i></div>`;b.onclick=()=>openStages(c);levels.appendChild(b)})}
function openStages(c){selected=c;show("stageScreen");let done=db.progress[c]||0,ss=stages(c),first=ss[0].n;stageTitle.innerHTML=`<b>${FLAG} ${c}</b> · ${done}/10 abgeschlossen`;stageGrid.innerHTML="";ss.forEach((s,i)=>{let unlocked=i<=done,b=document.createElement("button");b.className="stageCard "+(i<done?"done ":"")+(i===done?"current":"");b.disabled=!unlocked;b.innerHTML=`<div class="num">${s.n}</div><small>${FLAG} ${esc(s.location)}</small><small>${esc(s.landmark)}</small>`;b.onclick=()=>start(s.n);stageGrid.appendChild(b)})}
function start(n){currentStage=STAGES.find(s=>s.n===n);selected=currentStage.cefr;queue=shuffle(currentStage.items);stageXP=0;combo=0;lives=5;invuln=40;harpoon=null;bonus=[];particles=[];stageNum.textContent=n;stageXPEl();livesEl();reset();next();state="play";show("play");audioOn()}
function stageXPEl(){document.getElementById("stageXP").textContent=stageXP}function livesEl(){document.getElementById("lives").textContent=lives}
function reset(){player={x:W/2,y:PLAY_H,vx:0,facing:1};harpoon=null;balloons=[];bonus=[]}
function next(){if(!queue.length){complete();return}qItem=queue.shift();question.innerHTML=`${esc(qItem.q)}<small>${currentStage.cefr} · ${FLAG} ${esc(currentStage.location)} · Triff das passende deutsche Wort</small>`;let opts=shuffle([qItem.a,...qItem.d]).slice(0,3);balloons=opts.map((text,i)=>({text,correct:text===qItem.a,r:56,x:170+i*310,y:115+(i%2)*55,vx:(i%2?-1:1)*(1.15+Math.random()),vy:-1.4,color:COLORS[currentStage.cefr]}))}
function complete(){state="idle";let c=currentStage.cefr,done=Math.max(db.progress[c]||0,currentStage.n-stages(c)[0].n+1);db.progress[c]=done;db.xp+=stageXP;db.streak++;save();modal("STAGE CLEAR!",`${FLAG} ${esc(currentStage.location)} · ${esc(currentStage.landmark)}<br><br><b>+${stageXP} XP</b><br>8 Lernfragen geschafft.`)}
function fail(){state="idle";save();modal("NO LIVES",`Du warst in ${esc(currentStage.location)}.<br>Die Etappe bleibt offen — versuche sie erneut!`)}
function modal(t,p){const m=document.getElementById("modal");m.style.display="flex";m.innerHTML=`<div class="modalBox"><h2>${t}</h2><p>${p}</p><div class="actions"><button class="btn gold" id="again">NOCHMAL</button><button class="btn" id="stages">STAGES</button></div></div>`;again.onclick=()=>{m.style.display="none";start(currentStage.n)};stages.onclick=()=>{m.style.display="none";openStages(selected)}}
function mark(ok){let r=db.mastery[qItem.a]||{right:0,wrong:0};if(ok){r.right++;combo++;let g=25+combo*5;stageXP+=g;db.xp+=g;toast("RICHTIG! +"+g)}else{r.wrong++;combo=0;lives--;livesEl();toast("FALSCH!")}db.mastery[qItem.a]=r;save();if(!ok&&lives<=0)fail()}
function shoot(){if(state!=="play"||harpoon)return;audioOn();beep(520,.05,"square",.035);harpoon={x:player.x,top:PLAY_H-5}}
function hit(i){let b=balloons[i];harpoon=null;speak(b.text);if(b.correct){mark(true);pop(b.x,b.y);balloons.splice(i,1);bonus=[];setTimeout(()=>{if(state==="play")next()},260)}else{mark(false);pop(b.x,b.y);balloons.splice(i,1);invuln=65}}
function split(b){if(b.r>25)for(let k=0;k<2;k++)bonus.push({x:b.x+(k?15:-15),y:b.y,vx:k?2.2:-2.2,vy:-4,r:b.r*.48})}
function move(arr){for(let b of arr){b.vy+=.16;b.x+=b.vx;b.y+=b.vy;if(b.x-b.r<9){b.x=9+b.r;b.vx=Math.abs(b.vx)}if(b.x+b.r>W-9){b.x=W-9-b.r;b.vx=-Math.abs(b.vx)}if(b.y+b.r>PLAY_H){b.y=PLAY_H-b.r;b.vy=-Math.max(4.1,Math.min(8,b.r/8))}if(b.y-b.r<9){b.y=9+b.r;b.vy=Math.abs(b.vy)*.55}}}
function step(){let l=keys.left,r=keys.right;player.vx=l&&!r?-5.2:r&&!l?5.2:0;if(player.vx)player.facing=Math.sign(player.vx);player.x=Math.max(24,Math.min(W-24,player.x+player.vx));if(harpoon){harpoon.top-=17;if(harpoon.top<5)harpoon=null}move(balloons);move(bonus);if(harpoon)for(let i=balloons.length-1;i>=0;i--){let b=balloons[i];if(Math.abs(b.x-harpoon.x)<b.r&&harpoon.top<b.y+b.r&&harpoon.top>b.y-b.r){hit(i);break}}if(invuln>0)invuln--;for(let b of balloons.concat(bonus))if(invuln<=0&&Math.hypot(b.x-player.x,b.y-(player.y-34))<b.r+17){invuln=75;lives--;livesEl();toast("AUSWEICHEN!");if(lives<=0){fail();return}}particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.13;p.life--});particles=particles.filter(p=>p.life>0)}
function draw(){drawBg(currentStage||STAGES[0]);drawGround();bonus.forEach(b=>bubble(b,"#ffdc67",false));balloons.forEach(b=>bubble(b,b.color,true));if(harpoon){ctx.strokeStyle="#fff7d0";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(harpoon.x,PLAY_H);ctx.lineTo(harpoon.x,harpoon.top);ctx.stroke();ctx.fillStyle="#ffe15a";ctx.beginPath();ctx.moveTo(harpoon.x,harpoon.top-2);ctx.lineTo(harpoon.x-8,harpoon.top+11);ctx.lineTo(harpoon.x+8,harpoon.top+11);ctx.fill()}particles.forEach(p=>{ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.r,p.r)});ctx.globalAlpha=1;if(player)drawPlayer()}
const bgImages={}; function bgImage(s){const key=s.n;if(!bgImages[key]){const im=new Image();im.src=`assets/backgrounds/stage-${String(key).padStart(2,"0")}.svg`;bgImages[key]=im;}return bgImages[key]}
function drawBg(s){const im=bgImage(s);if(im.complete&&im.naturalWidth){ctx.drawImage(im,0,0,W,PLAY_H)}else{let g=ctx.createLinearGradient(0,0,0,PLAY_H);g.addColorStop(0,"#6d9fd0");g.addColorStop(1,"#d9edf1");ctx.fillStyle=g;ctx.fillRect(0,0,W,PLAY_H)}ctx.fillStyle="#0b1018d9";round(18,18,360,72,9);ctx.fill();ctx.font="900 18px system-ui";ctx.fillStyle="#fff";ctx.fillText(`${FLAG} ${s.location}`,34,48);ctx.font="600 12px system-ui";ctx.fillStyle="#d8deea";ctx.fillText(`${s.landmark} · ${s.state}`,34,69);ctx.font="900 11px system-ui";ctx.fillText("DEUTSCHLAND",W-125,32)}
function drawGround(){ctx.fillStyle="#1a1b1f";ctx.fillRect(0,PLAY_H,W,H-PLAY_H);ctx.fillStyle="#60743f";ctx.fillRect(0,PLAY_H,W,7)}
function bubble(b,c,target){ctx.save();ctx.shadowColor="#0008";ctx.shadowBlur=8;ctx.shadowOffsetY=5;let g=ctx.createRadialGradient(b.x-b.r*.35,b.y-b.r*.4,3,b.x,b.y,b.r);g.addColorStop(0,"#fff");g.addColorStop(.12,c);g.addColorStop(1,"#202531");ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.shadowColor="transparent";ctx.strokeStyle="#fff7";ctx.stroke();if(target){ctx.fillStyle="#fff";ctx.font=`900 ${b.r>48?18:14}px system-ui`;ctx.textAlign="center";ctx.textBaseline="middle";wrapText(b.text,b.x,b.y,b.r*1.7)}ctx.restore()}
function wrapText(t,x,y,max){let a=t.split(" "),lines=[],line="";for(let w of a){let z=line?line+" "+w:w;if(ctx.measureText(z).width>max&&line){lines.push(line);line=w}else line=z}if(line)lines.push(line);lines.forEach((l,i)=>ctx.fillText(l,x,y+(i-(lines.length-1)/2)*17))}
function drawPlayer(){let x=player.x,y=player.y,f=player.facing;ctx.save();if(invuln>0&&Math.floor(invuln/5)%2===0)ctx.globalAlpha=.45;ctx.fillStyle="#0007";ctx.beginPath();ctx.ellipse(x,y,28,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#15171b";ctx.fillRect(x-15,y-18,30,18);ctx.fillStyle="#e34a35";round(x-17,y-48,34,31,6);ctx.fill();ctx.fillStyle="#f0cf9f";ctx.beginPath();ctx.arc(x,y-59,15,0,Math.PI*2);ctx.fill();ctx.fillStyle="#2e65d7";ctx.fillRect(x-17,y-70,34,10);ctx.fillRect(x-10,y-77,20,9);ctx.fillStyle="#111";ctx.beginPath();ctx.arc(x-5+f*3,y-60,2,0,7);ctx.arc(x+5+f*3,y-60,2,0,7);ctx.fill();ctx.strokeStyle="#d8dbe2";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x-8,y-18);ctx.lineTo(x-11,y);ctx.moveTo(x+8,y-18);ctx.lineTo(x+11,y);ctx.stroke();ctx.fillStyle="#222";ctx.fillRect(x-17,y-1,12,5);ctx.fillRect(x+5,y-1,12,5);ctx.restore()}
function round(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function pop(x,y){for(let i=0;i<16;i++){let a=Math.random()*7;particles.push({x,y,vx:Math.cos(a)*(1+Math.random()*3),vy:Math.sin(a)*(1+Math.random()*3)-1,life:20+Math.random()*20,max:40,r:2+Math.random()*3,c:i%2?"#fff":"#ffd447"})}}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",650)}
let ac=null;function audioOn(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}}function beep(f,d,type="sine",g=.04){if(!ac)return;let o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.value=f;v.gain.value=g;o.connect(v);v.connect(ac.destination);o.start();v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}function speak(t){if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.88;speechSynthesis.speak(u)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
document.getElementById("homeBtn").onclick=()=>{state="menu";renderLevels();show("menu")};document.getElementById("backLevels").onclick=()=>{renderLevels();show("menu")};document.getElementById("quit").onclick=()=>openStages(selected);
function hold(el,k){el.onpointerdown=e=>{e.preventDefault();keys[k]=true};["pointerup","pointercancel","pointerleave"].forEach(t=>el.addEventListener(t,()=>keys[k]=false))}hold(document.getElementById("left"),"left");hold(document.getElementById("right"),"right");document.getElementById("fire").onpointerdown=e=>{e.preventDefault();shoot()};
addEventListener("keydown",e=>{if(e.code==="ArrowLeft"||e.code==="KeyA")keys.left=true;if(e.code==="ArrowRight"||e.code==="KeyD")keys.right=true;if(e.code==="Space"||e.code==="ArrowUp")shoot()});addEventListener("keyup",e=>{if(e.code==="ArrowLeft"||e.code==="KeyA")keys.left=false;if(e.code==="ArrowRight"||e.code==="KeyD")keys.right=false});
function loop(){if(state==="play")step();draw();requestAnimationFrame(loop)}topHud();renderLevels();loop();if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(()=>{}));
